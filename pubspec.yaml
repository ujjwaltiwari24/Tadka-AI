name: tadka_ai_latest
description: TADKA AI - Your personal cooking assistant.
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  google_mobile_ads: ^6.0.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  google_fonts: ^6.1.0
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/tadka_no_text.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/tadka_no_text.png"